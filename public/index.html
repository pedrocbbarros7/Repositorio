<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Combustíveis São Luís</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner { border:3px solid #e5e7eb; border-top-color:#2563eb; border-radius:50%; width:2rem; height:2rem; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .card-preco { font-variant-numeric: tabular-nums; }
    .btn-produto.active { background:#2563eb; color:#fff; border-color:#2563eb; }
    #gps-btn.locating { animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    ::-webkit-scrollbar { height:4px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:9999px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

<!-- Header fixo -->
<header class="bg-blue-700 text-white shadow-lg sticky top-0 z-20">
  <div class="px-4 py-3 flex items-center justify-between gap-3">
    <div>
      <h1 class="text-lg font-bold leading-tight">⛽ Combustíveis São Luís</h1>
      <p id="periodo-label" class="text-blue-200 text-xs"></p>
    </div>
    <button id="gps-btn"
      class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 active:bg-white/40 text-white font-semibold px-3 py-2 rounded-xl text-sm transition whitespace-nowrap">
      📍 Perto de mim
    </button>
  </div>
</header>

<!-- Banner demo -->
<div id="demo-banner" class="hidden bg-amber-50 border-b border-amber-300 px-4 py-3 text-sm flex gap-2 items-center">
  <span class="text-amber-700">⚠️ Dados de amostra.</span>
  <a href="https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/serie-historica-de-precos-de-combustiveis"
     target="_blank" class="text-blue-600 font-medium underline">Baixar CSV real da ANP</a>
</div>

<!-- Barra de busca -->
<div class="sticky top-[60px] z-10 bg-gray-100 px-4 pt-3 pb-2 shadow-sm">
  <div class="flex gap-2">
    <input id="search" type="search" placeholder="🔍 Nome do posto ou bairro…"
      class="flex-1 border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"/>
    <button id="btn-upload" class="bg-white border border-gray-300 rounded-xl px-3 py-2.5 text-sm shadow-sm hover:bg-gray-50">
      📂
    </button>
  </div>

  <!-- Filtros de produto (scroll horizontal) -->
  <div class="flex gap-2 mt-2 overflow-x-auto pb-1 no-scrollbar">
    <button class="btn-produto active flex-shrink-0 border border-blue-600 rounded-full px-3 py-1 text-xs font-semibold whitespace-nowrap transition" data-produto="">Todos</button>
    <button class="btn-produto flex-shrink-0 border border-gray-300 rounded-full px-3 py-1 text-xs font-semibold whitespace-nowrap bg-white transition" data-produto="ETANOL HIDRATADO">Etanol</button>
    <button class="btn-produto flex-shrink-0 border border-gray-300 rounded-full px-3 py-1 text-xs font-semibold whitespace-nowrap bg-white transition" data-produto="GASOLINA COMUM">Gasolina</button>
    <button class="btn-produto flex-shrink-0 border border-gray-300 rounded-full px-3 py-1 text-xs font-semibold whitespace-nowrap bg-white transition" data-produto="GASOLINA ADITIVADA">Aditivada</button>
    <button class="btn-produto flex-shrink-0 border border-gray-300 rounded-full px-3 py-1 text-xs font-semibold whitespace-nowrap bg-white transition" data-produto="DIESEL S10">Diesel S10</button>
    <button class="btn-produto flex-shrink-0 border border-gray-300 rounded-full px-3 py-1 text-xs font-semibold whitespace-nowrap bg-white transition" data-produto="GNV">GNV</button>
  </div>

  <!-- Ordenação -->
  <div class="flex gap-2 mt-2 items-center text-xs text-gray-500">
    <span class="font-medium">Ordenar:</span>
    <button id="sort-preco" class="sort-opt px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-semibold" data-sort="preco">Menor preço</button>
    <button id="sort-dist"  class="sort-opt px-2 py-0.5 rounded-full bg-white border border-gray-300 text-gray-600 font-medium" data-sort="distancia">Mais próximo</button>
    <span class="ml-auto text-gray-400" id="count-label">…</span>
  </div>
</div>

<!-- Cards de resumo (médias) -->
<div id="summary-bar" class="hidden flex gap-3 overflow-x-auto px-4 py-3 no-scrollbar"></div>

<!-- Loading -->
<div id="loading" class="flex flex-col items-center justify-center py-24 gap-3">
  <div class="spinner"></div>
  <p class="text-gray-500 text-sm">Carregando dados…</p>
</div>

<!-- GPS loading -->
<div id="gps-loading" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
  <div class="bg-white rounded-2xl p-6 text-center shadow-xl mx-4">
    <div class="spinner mx-auto mb-3"></div>
    <p class="font-semibold text-gray-800">Obtendo sua localização…</p>
    <p class="text-gray-500 text-sm mt-1">Permita o acesso ao GPS quando solicitado</p>
  </div>
</div>

<!-- Erro -->
<div id="error-box" class="hidden mx-4 mt-4 bg-red-50 border border-red-200 rounded-xl p-5 text-center">
  <p class="text-red-700 font-semibold mb-1">Erro ao carregar</p>
  <p id="error-msg" class="text-red-500 text-sm mb-3"></p>
  <button onclick="loadAll()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Tentar novamente</button>
</div>

<!-- Upload panel -->
<div id="upload-panel" class="hidden mx-4 mt-3 bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
  <p class="font-semibold text-gray-700 text-sm mb-2">📂 Carregar CSV da ANP</p>
  <label class="block border-2 border-dashed border-gray-300 rounded-xl p-5 text-center cursor-pointer hover:border-blue-400 transition"
    ondragover="event.preventDefault()" ondrop="handleDrop(event)">
    <p class="text-gray-500 text-sm">Toque para selecionar o arquivo</p>
    <p class="text-gray-400 text-xs mt-0.5">ca-AAAA-SS.csv da ANP</p>
    <input type="file" accept=".csv" class="hidden" onchange="handleFile(this.files[0])"/>
  </label>
  <p id="upload-status" class="text-xs mt-2 text-gray-500"></p>
</div>

<!-- Lista de postos -->
<div id="cards-container" class="px-4 py-3 space-y-3 pb-10"></div>

<!-- Vazio -->
<div id="empty-box" class="hidden text-center py-20 text-gray-400">
  <p class="text-5xl mb-3">🔍</p>
  <p class="font-semibold">Nenhum posto encontrado.</p>
</div>

<!-- Botão carregar mais -->
<div id="load-more-wrap" class="hidden px-4 pb-8">
  <button id="btn-load-more"
    class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-3 rounded-xl text-sm hover:bg-gray-50 active:bg-gray-100 transition shadow-sm">
    Mostrar mais postos
  </button>
</div>

<style>.no-scrollbar::-webkit-scrollbar{display:none;}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}</style>

<script>
const API    = '/api';
const PAGE   = 30;

let allItems  = [];
let filtered  = [];
let shown     = 0;
let sortMode  = 'preco';
let prodFilt  = '';
let searchQ   = '';
let userLat   = null;
let userLng   = null;

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');

/* ── Cores por produto ────────────────────────── */
const CORES = {
  'ETANOL HIDRATADO':   { bg:'bg-green-100',  text:'text-green-800',  dot:'🟢' },
  'GASOLINA COMUM':     { bg:'bg-blue-100',   text:'text-blue-800',   dot:'🔵' },
  'GASOLINA ADITIVADA': { bg:'bg-indigo-100', text:'text-indigo-800', dot:'🟣' },
  'DIESEL S10':         { bg:'bg-yellow-100', text:'text-yellow-800', dot:'🟡' },
  'DIESEL':             { bg:'bg-orange-100', text:'text-orange-800', dot:'🟠' },
  'GNV':                { bg:'bg-purple-100', text:'text-purple-800', dot:'🔴' },
};
function cor(p) {
  for (const [k,v] of Object.entries(CORES)) if (p.includes(k)) return v;
  return { bg:'bg-gray-100', text:'text-gray-700', dot:'⚪' };
}

/* ── Resumo topo ─────────────────────────────── */
const RESUMO_PRODS = [
  {key:'ETANOL HIDRATADO', label:'Etanol', c:'green'},
  {key:'GASOLINA COMUM',   label:'Gasolina', c:'blue'},
  {key:'DIESEL S10',       label:'Diesel S10', c:'yellow'},
];
function renderSummary(summary) {
  const bar = $('summary-bar');
  bar.innerHTML = '';
  RESUMO_PRODS.forEach(({key, label, c}) => {
    const s = summary.find(x => x.produto.includes(key));
    if (!s) return;
    bar.insertAdjacentHTML('beforeend', `
      <div class="flex-shrink-0 bg-white rounded-xl px-4 py-2.5 shadow-sm border border-gray-100 text-center min-w-[100px]">
        <p class="text-xs text-gray-500 font-medium">${label}</p>
        <p class="text-xl font-bold text-gray-900 card-preco">R$ ${fmt(s.media)}</p>
        <p class="text-xs text-gray-400">Mín <b class="text-${c}-600">R$ ${fmt(s.minimo)}</b></p>
      </div>`);
  });
  if (bar.children.length) show('summary-bar');
}

/* ── Cards de posto ──────────────────────────── */
function renderCard(r) {
  const c   = cor(r.produto);
  const km  = r.distancia != null ? `<span class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">📍 ${r.distancia < 1 ? (r.distancia*1000).toFixed(0)+'m' : r.distancia.toFixed(1)+'km'}</span>` : '';
  const maps = r.lat && r.lng
    ? `<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank"
         class="text-xs text-blue-600 font-medium flex items-center gap-1 hover:underline">
         🗺️ Ver no mapa
       </a>`
    : '';

  return `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 active:bg-gray-50 transition">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-gray-900 leading-snug truncate">${esc(r.nome)}</p>
          <p class="text-xs text-gray-500 mt-0.5 truncate">📌 ${esc(r.bairro)}${r.endereco ? ' · ' + esc(r.endereco) : ''}</p>
          ${r.bandeira ? `<p class="text-xs text-gray-400 mt-0.5">${esc(r.bandeira)}</p>` : ''}
        </div>
        <div class="text-right flex-shrink-0">
          <p class="text-2xl font-bold text-gray-900 card-preco">R$ ${fmt(r.preco)}</p>
          <p class="text-xs text-gray-400">${r.unidade || 'R$/l'}</p>
        </div>
      </div>
      <div class="flex items-center justify-between mt-3 flex-wrap gap-2">
        <span class="${c.bg} ${c.text} text-xs font-semibold px-2.5 py-1 rounded-full">${c.dot} ${esc(r.produto)}</span>
        <div class="flex items-center gap-2">
          ${km}
          ${maps}
        </div>
      </div>
      ${r.data ? `<p class="text-xs text-gray-300 mt-1 text-right">Coleta: ${esc(r.data)}</p>` : ''}
    </div>`;
}

function renderCards(append = false) {
  const container = $('cards-container');
  if (!append) { container.innerHTML = ''; shown = 0; }

  if (filtered.length === 0 && !append) { hide('cards-container'); show('empty-box'); hide('load-more-wrap'); return; }
  hide('empty-box'); show('cards-container');

  const slice = filtered.slice(shown, shown + PAGE);
  container.insertAdjacentHTML('beforeend', slice.map(renderCard).join(''));
  shown += slice.length;

  $('count-label').textContent = `${filtered.length} posto${filtered.length !== 1 ? 's' : ''}`;

  if (shown < filtered.length) show('load-more-wrap');
  else hide('load-more-wrap');
}

/* ── Filter + Sort ───────────────────────────── */
function applyFilters() {
  let rows = [...allItems];

  if (prodFilt) rows = rows.filter(r => r.produto.includes(prodFilt));
  if (searchQ) {
    const t = searchQ.toLowerCase();
    rows = rows.filter(r =>
      r.nome.toLowerCase().includes(t) ||
      r.bairro.toLowerCase().includes(t) ||
      r.endereco.toLowerCase().includes(t));
  }

  // Ordenação
  if (sortMode === 'distancia' && rows.some(r => r.distancia != null)) {
    rows.sort((a,b) => {
      const da = a.distancia ?? Infinity;
      const db = b.distancia ?? Infinity;
      return da - db;
    });
  } else {
    rows.sort((a,b) => a.preco - b.preco);
  }

  filtered = rows;
  renderCards(false);
}

/* ── GPS ─────────────────────────────────────── */
function setUserCoords(lat, lng) {
  userLat = lat; userLng = lng;
  // Adiciona distância a todos os itens
  allItems = allItems.map(r => ({
    ...r,
    distancia: r.lat && r.lng
      ? +haversine(lat, lng, r.lat, r.lng).toFixed(2)
      : null,
  }));
  sortMode = 'distancia';
  updateSortUI();
  applyFilters();
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

function requestGps() {
  if (!navigator.geolocation) {
    alert('Seu navegador não suporta GPS.'); return;
  }
  show('gps-loading');
  $('gps-btn').classList.add('locating');
  navigator.geolocation.getCurrentPosition(
    pos => {
      hide('gps-loading');
      $('gps-btn').classList.remove('locating');
      $('gps-btn').textContent = '📍 Localizado';
      setUserCoords(pos.coords.latitude, pos.coords.longitude);
    },
    err => {
      hide('gps-loading');
      $('gps-btn').classList.remove('locating');
      const msgs = {1:'Permissão negada. Libere o GPS nas configurações do navegador.',2:'GPS indisponível.',3:'Timeout ao obter localização.'};
      alert(msgs[err.code] || 'Erro ao obter localização.');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

/* ── Sort UI ─────────────────────────────────── */
function updateSortUI() {
  document.querySelectorAll('.sort-opt').forEach(b => {
    const active = b.dataset.sort === sortMode;
    b.className = `sort-opt px-2 py-0.5 rounded-full text-xs font-semibold transition ${
      active ? 'bg-blue-100 text-blue-700' : 'bg-white border border-gray-300 text-gray-600'}`;
  });
}

/* ── Carrega dados ───────────────────────────── */
async function loadAll() {
  show('loading'); hide('error-box'); hide('summary-bar'); hide('cards-container'); hide('empty-box');

  try {
    const params = new URLSearchParams({ limit: 1000 });
    if (userLat !== null) { params.set('lat', userLat); params.set('lng', userLng); }

    const [dataRes, pRes] = await Promise.all([
      fetch(`${API}/precos?${params}`).then(r=>r.json()),
      fetch(`${API}/produtos`).then(r=>r.json()),
    ]);

    if (!dataRes.success) throw new Error(dataRes.error || 'Erro desconhecido');

    allItems = dataRes.items;
    if (dataRes.meta?.periodo) $('periodo-label').textContent = dataRes.meta.periodo;

    if (dataRes.demo) show('demo-banner'); else hide('demo-banner');

    renderSummary(dataRes.summary || []);
    applyFilters();
  } catch(err) {
    $('error-msg').textContent = err.message;
    show('error-box');
  } finally {
    hide('loading');
  }
}

/* ── Upload ──────────────────────────────────── */
async function handleFile(file) {
  if (!file) return;
  const st = $('upload-status');
  st.textContent = `Lendo ${file.name}…`;
  try {
    const text = await file.text();
    st.textContent = 'Enviando…';
    const res = await fetch('/api/upload', { method:'POST', headers:{'Content-Type':'text/csv'}, body:text }).then(r=>r.json());
    if (!res.success) throw new Error(res.error);
    st.textContent = `✅ ${res.rows} registros carregados!`;
    hide('upload-panel');
    await loadAll();
  } catch(err) { st.textContent = `❌ ${err.message}`; }
}
function handleDrop(e) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }

/* ── Eventos ─────────────────────────────────── */
$('gps-btn').addEventListener('click', requestGps);

$('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  applyFilters();
});

document.querySelectorAll('.btn-produto').forEach(btn => {
  btn.addEventListener('click', () => {
    prodFilt = btn.dataset.produto;
    document.querySelectorAll('.btn-produto').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  });
});

document.querySelectorAll('.sort-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.sort === 'distancia' && userLat === null) {
      requestGps(); return;
    }
    sortMode = btn.dataset.sort;
    updateSortUI();
    applyFilters();
  });
});

$('btn-load-more').addEventListener('click', () => renderCards(true));

$('btn-upload').addEventListener('click', () => {
  $('upload-panel').classList.toggle('hidden');
});

/* ── Utils ───────────────────────────────────── */
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(n) { return Number(n).toFixed(2).replace('.',','); }

/* ── Init ────────────────────────────────────── */
loadAll();

// Verifica a cada 15s se a ANP terminou de carregar e atualiza silenciosamente
let anpPoller = setInterval(async () => {
  try {
    const st = await fetch('/api/status').then(r => r.json());
    if (!st.demo && st.rows > 0) {
      clearInterval(anpPoller);
      // Recarrega silenciosamente com dados reais
      const params = new URLSearchParams({ limit: 1000 });
      if (userLat !== null) { params.set('lat', userLat); params.set('lng', userLng); }
      const data = await fetch(`/api/precos?${params}`).then(r => r.json());
      if (data.success && !data.demo) {
        allItems = data.items;
        if (data.meta?.periodo) $('periodo-label').textContent = data.meta.periodo;
        hide('demo-banner');
        renderSummary(data.summary || []);
        applyFilters();
      }
    }
  } catch(e) { /* ignora */ }
}, 15000);
</script>
</body>
</html>
